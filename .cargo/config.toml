# Local convenience commands.
#
# `cargo test --all` builds this crate with `default = []`, which is the right
# default for a zero-dependency library and the wrong default for finding out
# whether your change works: the integration suites behind `relay-client`/`tls`
# compile to *zero tests*, report `ok`, and are simply absent. Measured
# 2026-09-07: 721 tests instead of 808 — the same 22 test binaries run either
# way, four of them empty, all green, with every relay and TLS path unbuilt.
# (`CLAUDE.md` carries the same two numbers; they are measured together so they
# cannot drift apart.)
#
# CI already runs the full set, and `tests/ci_feature_gates.rs` proves CI's
# command line covers every gate. What that check could not fix is the command
# a person types before pushing. This alias is that command.
#
#     cargo test-all      # what CI runs — use this before pushing
#     cargo test --all    # default features only; still worth running, since
#                         # CI checks the zero-dependency build too
#
# `tests/ci_feature_gates.rs` holds this alias to the same rule it holds CI to,
# so a third gate cannot appear without turning up here.
[alias]
test-all = ["test", "--all", "--features", "relay-client,tls"]
clippy-all = [
    "clippy",
    "--all-targets",
    "--features",
    "relay-client,tls",
    "--",
    "-D",
    "warnings",
]
