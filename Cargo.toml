[package]
name = "shell-tunnel"
version = "0.16.0"
edition = "2021"
# MSRV of the default (zero-dependency) build, derived from the highest declared
# rust-version among default-feature dependencies (axum 0.8 = 1.78). The optional
# `self-update` feature pulls crates that require a newer toolchain (~1.83+).
# Reasoned from declared dep MSRVs; toolchain-verify in CI.
rust-version = "1.78"
description = "Ultra-lightweight remote shell gateway with a REST/WebSocket API"
license = "MIT"
repository = "https://github.com/iyulab/shell-tunnel"
homepage = "https://github.com/iyulab/shell-tunnel"
documentation = "https://docs.rs/shell-tunnel"
readme = "README.md"
keywords = ["shell", "tunnel", "pty", "api", "remote"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
authors = ["iyulab"]
exclude = [
    ".github/",
    "local-docs/",
    "docs/",
    "tests/",
]

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "io-util", "sync", "time", "macros", "signal"] }

# Cross-platform PTY
portable-pty = "0.9"

# OS entropy for API keys and enroll tokens. The one crate the security layer
# is allowed to lean on: key material derived from anything cheaper (the clock)
# has already shipped as a predictable-credential bug.
getrandom = "0.3"

# SHA-256 for transfer integrity. `ring` is only present under the tls/relay
# features, so the default build has no hash available — and hand-rolling one
# means owning 150 lines of bit twiddling forever. Same call as `getrandom`:
# a single small crate, taken deliberately.
sha2 = "0.10"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal emulation (Phase 2)
vte = "0.15"
vt100 = "0.16"

# API Layer (Phase 3)
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI (Phase 5) - minimal footprint (~34KB)
lexopt = "0.3"
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Relay client (optional). Dialling out to a relay needs a WebSocket client and,
# for wss://, a TLS stack — neither of which the local-listen core build has any
# use for. Same shape as `self-update`: off by default, on in release binaries.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
# rustls 0.23 refuses to pick a crypto backend implicitly, so the provider is
# selected here and installed explicitly at startup — otherwise the first wss://
# connection panics at runtime rather than failing gracefully.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

# Serving TLS directly (optional). Terminating TLS in-process is what lets a
# relay run without a reverse proxy in front of it; the accept loop and the
# WebSocket upgrade path are subtle enough to be worth a maintained crate.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
rustls-pemfile = { version = "2", optional = true }
# Generating a self-signed certificate. Shares `ring` with rustls, so the
# marginal cost is small — and it removes the openssl incantation that stands
# between an operator and an encrypted relay.
rcgen = { version = "0.14", optional = true }
# SHA-256 for certificate fingerprints. Already in the tree under rustls, so
# naming it explicitly costs nothing and avoids reaching through a dependency.
ring = { version = "0.17", optional = true }
# Public trust anchors, so naming a private CA adds to them rather than replacing them.
webpki-roots = { version = "0.26", optional = true }

# Auto-update (optional, off by default to keep the core binary zero-dependency).
# Pulls a large transitive tree (reqwest/hyper-rustls/self_update -> quick-xml, time, number_prefix)
# that is only needed for `--update`/`--check-update`. Enable with `--features self-update`.
# rustls-tls avoids OpenSSL for cross-compilation. `compression-flate2` only covers
# .tar.gz; extracting the Windows .zip needs `compression-zip-deflate` as well.
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"], optional = true }

[features]
# Core binary is zero-dependency by default; self-update is opt-in.
default = []
# In-binary self-update via GitHub Releases (adds a large transitive dependency tree).
self-update = ["dep:self_update"]
# Dial out to a self-hosted relay (adds a WebSocket client and a TLS stack).
relay-client = ["dep:tokio-tungstenite", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots", "dep:ring"]
# Terminate TLS in-process (--tls-cert / --tls-key), no reverse proxy required.
tls = ["dep:axum-server", "dep:rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:ring"]

[dev-dependencies]
tokio-test = "0.4"
# A TLS client for the TLS tests, so the handshake is exercised for real.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Reading a generated certificate back in the TLS tests.
rustls-pemfile = "2"
tempfile = "3"
# WebSocket client for the end-to-end tests. The rustls feature is what lets the
# TLS tests trust a certificate generated for that test alone.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Faster builds for development
incremental = true

[target."cfg(unix)".dependencies]
libc = "0.2.180"



