name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates) so
# stale builds don't keep consuming Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `relay-client` is included deliberately. Both relay end-to-end files are
      # gated behind it (`#![cfg(feature = "relay-client")]`), so a plain
      # `cargo test --all` compiles them to *zero tests* and reports green
      # without having run one of them. That is how a relay defect reaching
      # every body-carrying request survived three minor versions: the file
      # that would have caught it was never executed here.
      - name: Run tests
        run: cargo test --all --features relay-client --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` and `relay-client` for the same reason the test job
      # carries the feature: without the former, test and example code is never
      # linted at all; without the latter, the two relay end-to-end files are
      # not even compiled here. A lint that skips the code most likely to be
      # written in a hurry is not the lint anyone thinks it is.
      - name: Clippy
        run: cargo clippy --all-targets --features relay-client -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The declared `rust-version` was reasoned from dependency manifests, not
      # measured. Building on exactly that toolchain is what turns it from a
      # claim into a fact.
      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Default features only: the optional ones pull crates that need a newer
      # toolchain, which the manifest comment already records.
      - name: Build with the declared MSRV
        run: cargo build --locked
