name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates) so
# stale builds don't keep consuming Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The rule, rather than a count of the files it currently applies to: a
      # suite gated by `#![cfg(feature = "…")]` compiles to *zero tests* without
      # that feature and reports green having run none of them, so every feature
      # any suite is gated behind belongs on this line. That is how a relay
      # defect reaching every body-carrying request survived three minor
      # versions — the file that would have caught it was never executed here.
      #
      # This comment used to name the two files gated at the time. A third gate
      # (`tls`) arrived, the sentence stayed true-sounding, and the TLS relay
      # suite went unrun on all three platforms until someone counted again.
      # Whatever gates exist, list their features; do not enumerate the files.
      #
      # `tests/ci_feature_gates.rs` now checks this line against the gates it
      # finds, so a fourth gate fails a test instead of relying on this comment
      # being reread. It carries no feature gate of its own, deliberately.
      - name: Run tests
        run: cargo test --all --features relay-client,tls --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` and the same feature set as the test job, for the same
      # reason: without the former, test and example code is never linted at
      # all; without the latter, a gated suite is not even compiled here. A lint
      # that skips the code most likely to be written in a hurry is not the lint
      # anyone thinks it is.
      #
      # The two feature lists are kept identical on purpose. Linting a narrower
      # set than the tests build leaves feature-gated code — including the code
      # that only exists when `tls` is on — unlinted.
      - name: Clippy
        run: cargo clippy --all-targets --features relay-client,tls -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The declared `rust-version` was reasoned from dependency manifests, not
      # measured. Building on exactly that toolchain is what turns it from a
      # claim into a fact.
      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Default features only: the optional ones pull crates that need a newer
      # toolchain, which the manifest comment already records.
      - name: Build with the declared MSRV
        run: cargo build --locked

      # And run that build's tests, which nothing else does. Every other job
      # enables `relay-client,tls`, so a test that only compiles with a feature
      # can sit red in the default build indefinitely while all three OS jobs
      # stay green -- one did, and it was found by hand rather than by CI.
      #
      # The marker is load bearing: `tests/ci_feature_gates.rs` otherwise
      # requires every `cargo test` here to enable every gated feature, which is
      # exactly what this command must not do.
      - name: Test the default build
        run: cargo test --all # default-build-on-purpose
