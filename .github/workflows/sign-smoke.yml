name: Sign smoke test

# Exercises the signing path of release.yml without publishing anything.
# Pushing a `v*` tag *is* the publish, and nothing else runs the sign job, so
# run this by hand after changing signing — and before the first tag that
# depends on it. Its only artifact is the unsigned executable, kept one day.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --features self-update,relay-client,tls

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-smoke
          path: target/release/shell-tunnel.exe
          retention-days: 1

  # Same shape as release.yml's `sign-windows`: the job holding the signing
  # identity runs nothing from the build.
  sign:
    name: Sign and verify
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download unsigned executable
        uses: actions/download-artifact@v8
        with:
          name: unsigned-smoke
          path: bin

      - name: Sign
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce # main @ 2026-10-17
        with:
          files: bin/shell-tunnel.exe
          description: shell-tunnel
          description-url: https://github.com/iyulab/shell-tunnel

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "bin/shell-tunnel.exe"
          Write-Host "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)  Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "signature carries no timestamp" }
          & "bin/shell-tunnel.exe" --version
