name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: shell-tunnel
            archive: shell-tunnel-linux-x64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: shell-tunnel
            archive: shell-tunnel-linux-arm64.tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: shell-tunnel.exe
            archive: shell-tunnel-windows-x64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: shell-tunnel
            archive: shell-tunnel-macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: shell-tunnel
            archive: shell-tunnel-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Prebuilt `cross` binary instead of `cargo install --git` (which compiles
      # from source every release) — cuts several minutes of Actions time.
      - name: Install cross (for ARM64 Linux)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Release binaries bundle the opt-in features so a downloaded binary can do
      # what the docs advertise — `--update` and `--relay` — while the default
      # source build stays zero-dependency.
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --features self-update,relay-client --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --features self-update,relay-client --target ${{ matrix.target }}

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Binaries are now attached to the GitHub Release; drop the transient
      # build artifacts immediately so they consume no Actions storage.
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: shell-tunnel-*
          useGlob: true
          failOnError: false

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
