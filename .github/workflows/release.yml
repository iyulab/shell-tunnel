name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: shell-tunnel
            archive: shell-tunnel-linux-x64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: shell-tunnel
            archive: shell-tunnel-linux-arm64.tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: shell-tunnel.exe
            archive: shell-tunnel-windows-x64.zip
            sign: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: shell-tunnel
            archive: shell-tunnel-macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: shell-tunnel
            archive: shell-tunnel-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Prebuilt `cross` binary instead of `cargo install --git` (which compiles
      # from source every release) — cuts several minutes of Actions time.
      - name: Install cross (for ARM64 Linux)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Release binaries bundle the opt-in features so a downloaded binary can do
      # what the docs advertise — `--update` and `--relay` — while the default
      # source build stays zero-dependency.
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --features self-update,relay-client,tls --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --features self-update,relay-client,tls --target ${{ matrix.target }}

      - name: Create archive
        if: ${{ !matrix.sign }}
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Upload artifact
        if: ${{ !matrix.sign }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 1

      # The executable to be signed leaves this job unpackaged; `sign-windows`
      # signs it and builds the zip.
      - name: Upload unsigned executable
        if: matrix.sign
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.archive }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          retention-days: 1

  # Signing is its own job so that the job holding the signing identity — OIDC
  # to Azure Key Vault, matched by the federated credential
  # `repo:iyulab/shell-tunnel:environment:production` — runs no build tooling
  # and no third-party action from the build. Only the composite action from
  # iyulab/code-sign, pinned by SHA, touches the credential.
  sign-windows:
    name: Sign Windows executable
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      EXE: shell-tunnel.exe
      ARCHIVE: shell-tunnel-windows-x64.zip
    steps:
      - name: Download unsigned executable
        uses: actions/download-artifact@v8
        with:
          name: unsigned-shell-tunnel-windows-x64.zip
          path: bin

      # Signed before it goes into the zip: the binary `--update` installs is
      # the one inside the archive, not a top-level release asset.
      - name: Sign
        uses: iyulab/code-sign@ad912c9656a20729c7891c0e9b6b4857164efee9 # main @ 2026-10-16
        with:
          files: bin/shell-tunnel.exe
          description: shell-tunnel
          description-url: https://github.com/iyulab/shell-tunnel

      # A sign step that reports success is not evidence the file is signed —
      # refuse to package anything that does not carry a valid signature.
      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "bin/$env:EXE"
          Write-Host "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)  Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "signature carries no timestamp" }

      - name: Create archive
        shell: pwsh
        run: |
          Push-Location bin
          7z a "../$env:ARCHIVE" $env:EXE
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: shell-tunnel-windows-x64.zip
          path: shell-tunnel-windows-x64.zip
          retention-days: 1

  release:
    name: Create Release
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Release archives only. The unsigned executable is an artifact too, and
      # a catch-all `files:` glob would attach it to the Release.
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: shell-tunnel-*
          path: artifacts

      # Each archive lands in its own `artifacts/<name>/` directory, named like the
      # file inside it, so they are moved aside before the directories go. Flatten them
      # so the Release carries exactly the archives plus `SHA256SUMS`, and hash
      # from inside the directory so each line names the bare asset file — the
      # form a device matches a downloaded archive against.
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir flat
          find artifacts -type f -exec mv -t flat {} +
          rm -rf artifacts
          mv flat artifacts
          cd artifacts
          sha256sum shell-tunnel-* > SHA256SUMS
          cat SHA256SUMS

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/shell-tunnel-*
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Binaries are now attached to the GitHub Release; drop the transient
      # build artifacts immediately so they consume no Actions storage.
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            shell-tunnel-*
            unsigned-*
          useGlob: true
          failOnError: false

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
